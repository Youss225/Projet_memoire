<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contactez-nous | PETRO DISTRIBUTIONS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding:80px 20px;

background:
linear-gradient(rgba(9,25,48,.85),rgba(9,25,48,.85)),
url("/media/Logo.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;

overflow-y:auto;

}

.container{

width:850px;
max-width:95%;

background:rgba(255,255,255,.97);

padding:50px;

border-radius:28px;

box-shadow:0 30px 70px rgba(0,0,0,.35);

margin:40px auto;

animation:fade .7s ease;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

text-align:center;
margin-bottom:20px;

}

.logo img{

width:130px;
height:130px;

object-fit:contain;

background:white;

padding:10px;

border-radius:22px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}

h1{

text-align:center;

font-size:32px;

margin-top:10px;
margin-bottom:12px;

color:#0f172a;

}

.subtitle{

text-align:center;

color:#64748b;

margin-bottom:35px;

line-height:1.6;

font-size:15px;

}

.row{

display:flex;

gap:20px;

margin-bottom:22px;

}

.row .input-group{

flex:1;

margin-bottom:0;

}

.input-group{

margin-bottom:22px;

}

label{

display:block;

font-weight:bold;

margin-bottom:8px;

color:#334155;

font-size:15px;

}

input,
select,
textarea{

width:100%;

padding:15px;

border:1px solid #dbe3ee;

border-radius:14px;

font-size:15px;

transition:.25s;

background:#f8fafc;

}

textarea{

resize:vertical;

min-height:180px;

}

input:focus,
select:focus,
textarea:focus{

outline:none;

border-color:#2563eb;

box-shadow:0 0 15px rgba(37,99,235,.15);

background:white;

}

/* ===== MESSAGE ===== */

.message-group{

margin-top:10px;

text-align:center;

}

.message-group label{

display:block;

font-size:22px;

font-weight:bold;

margin-bottom:15px;

}

.message-group textarea{

width:80%;

margin:auto;

display:block;

}

/* ===== NOTE ===== */

.note-group{

text-align:center;

margin-top:30px;

}

.note-group label{

display:block;

font-size:22px;

font-weight:bold;

margin-bottom:18px;

}

.avis{

text-align:center;

font-size:20px;

margin-top:10px;
margin-bottom:12px;

color:#0f172a;

}

.stars{

display:flex;

justify-content:center;

align-items:center;

gap:12px;

font-size:40px;

}

.star{

cursor:pointer;

transition:.2s;

color:#d1d5db;

}

.star:hover{

transform:scale(1.2);

}

.star.active{

color:#f59e0b;

}

/* ===== BOUTON ===== */

button{

width:100%;

margin-top:35px;

padding:17px;

font-size:17px;

font-weight:bold;

border:none;

border-radius:14px;

cursor:pointer;

background:linear-gradient(90deg,#2563eb,#1d4ed8);

color:white;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

box-shadow:0 15px 25px rgba(37,99,235,.35);

}

/* ===== MESSAGE SUCCES ===== */

.success{

display:none;

background:#dcfce7;

padding:16px;

border-radius:12px;

margin-bottom:25px;

text-align:center;

color:#166534;

font-weight:bold;

}

/* ===== FOOTER ===== */

.footer{

text-align:center;

margin-top:30px;

font-size:13px;

color:#94a3b8;

}

/* ===== RESPONSIVE ===== */

@media(max-width:768px){

.container{

padding:30px;

}

.row{

flex-direction:column;

gap:0;

}

.message-group textarea{

width:100%;

}

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        <img src="/media/Logo.jpg">
    </div>

    <h1>PETRO DISTRIBUTIONS</h1>

    <p class="subtitle">
        Notre équipe commerciale reste à votre disposition.<br>
        Merci de remplir le formulaire ci-dessous.
    </p>

    <div class="success" id="success">
        ✅ Votre message a été envoyé avec succès.
    </div>

    <form id="feedbackForm">
        {% csrf_token %}
        <!-- Ligne 1 -->

        <div class="row">

            <div class="input-group">
                <label>Nom complet</label>
                <input
                    type="text"
                    id="nom"
                    required>
            </div>

            <div class="input-group">
                <label>Entreprise</label>
                <input
                    type="text"
                    id="entreprise">
            </div>

        </div>

        <!-- Ligne 2 -->

        <div class="row">

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    required>
            </div>

            <div class="input-group">
                <label>Téléphone</label>
                <input
                    type="text"
                    id="telephone">
            </div>

        </div>

        <!-- Ligne 3 -->

        <div class="row">

            <div class="input-group">

                <label>Type de demande</label>

                <select id="type_message">

                    <option value="SAT">Satisfaction</option>
                    <option value="REC">Réclamation</option>
                    <option value="SUG">Suggestion</option>
                    <option value="INC">Incident</option>

                </select>

            </div>

            <div class="input-group">

                <label>Sujet</label>

                <input
                    type="text"
                    id="sujet"
                    required>

            </div>

        </div>

        <!-- MESSAGE -->

        <div class="message-group">

            <label>Votre message</label>

            <textarea
                id="message"
                required></textarea>

        </div>

        <!-- NOTE -->

        <div class="rating-box">

            <label class="avis">Évaluez notre service</label>

            <div class="stars">

                <span class="star active">★</span>
                <span class="star active">★</span>
                <span class="star active">★</span>
                <span class="star active">★</span>
                <span class="star active">★</span>

            </div>

            <input
                type="hidden"
                id="note"
                value="5">

        </div>

        <button type="submit">
            📨 Envoyer le message
        </button>

    </form>

    <div class="footer">
        © 2026 PETRO DISTRIBUTIONS
    </div>

</div>

<script>

const stars = document.querySelectorAll(".star");
const noteInput = document.getElementById("note");

// ===============================
// Gestion des étoiles
// ===============================

stars.forEach((star, index) => {

    star.addEventListener("click", () => {

        noteInput.value = index + 1;

        stars.forEach((s, i) => {

            if (i <= index) {
                s.classList.add("active");
            } else {
                s.classList.remove("active");
            }

        });

    });

});

// ===============================
// Envoi du formulaire
// ===============================

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {

        const cookies = document.cookie.split(";");

        for (let cookie of cookies) {

            cookie = cookie.trim();

            if (cookie.startsWith(name + "=")) {

                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );

                break;

            }

        }

    }

    return cookieValue;

}

const csrftoken = getCookie("csrftoken");

document.getElementById("feedbackForm").addEventListener("submit", function(e){

    e.preventDefault();

    fetch("/api/feedback/",{

method:"POST",

headers:{

"Content-Type":"application/json",

"X-CSRFToken":csrftoken

},

body:JSON.stringify({

nom:nom.value,

entreprise:entreprise.value,

email:email.value,

telephone:telephone.value,

type_message:type_message.value,

sujet:sujet.value,

message:message.value,

note:Number(note.value)

})

})

    .then(response => {

        if(!response.ok){
            throw new Error("Erreur lors de l'envoi.");
        }

        return response.json();

    })

    .then(data => {

        document.getElementById("success").style.display = "block";

        document.getElementById("feedbackForm").reset();

        // Remettre automatiquement 5 étoiles

        noteInput.value = 5;

        stars.forEach(star => {
            star.classList.add("active");
        });

        // Remonter sur le message de succès

        document.getElementById("success").scrollIntoView({
            behavior:"smooth"
        });

    })

    .catch(error => {

        alert("Impossible d'envoyer votre message.");

        console.error(error);

    });

});

</script>

</body>

</html>
